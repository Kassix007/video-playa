<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const stored = localStorage.getItem("video-playa-theme");
        const mode = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
        const resolved = mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : mode === "system" ? "light" : mode;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <meta name="theme-color" content="#0b1012" />
    <meta name="description" content="Build and watch links from the Video Playa program guide." />
    <title>Video Playa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
