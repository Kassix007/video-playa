[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[functions.mcp]
  external_node_modules = ["@napi-rs/canvas"]
  included_files = ["node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs"]

[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/oauth-protected-resource"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource/mcp"
  to = "/.netlify/functions/oauth-protected-resource"
  status = 200
  force = true

[[redirects]]
  from = "/api/council/latest"
  to = "/.netlify/functions/council-latest"
  status = 200
  force = true

[[redirects]]
  from = "/api/horsee/scheduler/status"
  to = "/.netlify/functions/horsee-scheduler-api"
  status = 200
  force = true

[[redirects]]
  from = "/api/horsee/scheduler/run"
  to = "/.netlify/functions/horsee-scheduler-api"
  status = 200
  force = true

[[redirects]]
  from = "/api/horsee/jobs/today"
  to = "/.netlify/functions/horsee-jobs"
  status = 200
  force = true

[[redirects]]
  from = "/api/horsee/jobs/ready"
  to = "/.netlify/functions/horsee-jobs"
  status = 200
  force = true

[[redirects]]
  from = "/api/horsee/jobs/next"
  to = "/.netlify/functions/horsee-jobs"
  status = 200
  force = true

[[redirects]]
  from = "/api/horsee/jobs/*"
  to = "/.netlify/functions/horsee-jobs"
  status = 200
  force = true

[[redirects]]
  from = "/api/horsee/archive/status"
  to = "/.netlify/functions/horsee-archive-api"
  status = 200
  force = true

[[redirects]]
  from = "/api/horsee/archive/run"
  to = "/.netlify/functions/horsee-archive-api"
  status = 200
  force = true

[[redirects]]
  from = "/api/horsee/archive/cleanup"
  to = "/.netlify/functions/horsee-archive-api"
  status = 200
  force = true

[[redirects]]
  from = "/api/council/today"
  to = "/.netlify/functions/council-today"
  status = 200
  force = true

[[redirects]]
  from = "/api/council/history/dates"
  to = "/.netlify/functions/council-history-dates"
  status = 200
  force = true

[[redirects]]
  from = "/api/council/history"
  to = "/.netlify/functions/council-history"
  status = 200
  force = true

[[redirects]]
  from = "/prog.txt"
  to = "/.netlify/functions/proxy"
  status = 200
  force = true
