[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/oauth-protected-resource"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource/mcp"
  to = "/.netlify/functions/oauth-protected-resource"
  status = 200
  force = true

[[redirects]]
  from = "/api/council/latest"
  to = "/.netlify/functions/council-latest"
  status = 200
  force = true

[[redirects]]
  from = "/prog.txt"
  to = "/.netlify/functions/proxy"
  status = 200
  force = true
